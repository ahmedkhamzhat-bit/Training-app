:root{

  --gv:#7bc79a; --rv:#ff3b30; --vink:#0b1114;
  --f-disp:'Archivo','Arial Narrow',Arial,sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-num:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f1f4f5; --s1:#ffffff; --s2:#e6ecee; --line:#d2dadd;
  --fg:#12181b; --mut:#5a676d; --acc:#1d6e8a; --acc-ink:#ffffff;
  --good:#2b7a30; --warn:#955f00; --bad:#e0160a; --bad-ink:#ffffff;
  --ph:#8995a0; --scrim:rgba(10,22,28,.4);
  --gv:#72bf90; --rv:#ff2d20; --vink:#0b1114;
  color-scheme:light;
}

  const slot=pw/n,bw=Math.min(28,slot*.64);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'')+'">';
  [0,top/2,top].forEach(v=>{
    const y=Y(v);
    s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" style="stroke:var(--line)" stroke-width="1"/>'+
       '<text x="'+(pl-6)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" '+SVGT+'>'+short(v)+(o.unit?' '+esc(o.unit):'')+'</text>';
  });
  items.forEach((it,i)=>{
    const x=pl+slot*i+(slot-bw)/2,h=Math.max(it.v>0?2:0,Y(0)-Y(it.v));
    s+='<rect x="'+x.toFixed(1)+'" y="'+(Y(0)-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" style="fill:var(--acc)"/>';
    if(o.vals&&slot>=22&&it.v>0)s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(Y(0)-h-4).toFixed(1)+'" text-anchor="middle" font-size="10" style="fill:var(--fg);font-family:var(--f-num)">'+short(it.v)+'</text>';
  });
  if(o.target){
    const y=Y(o.target).toFixed(1);
    s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--warn)" stroke-width="1.2" stroke-dasharray="4 3"/>'+
       '<text x="'+(W-pr)+'" y="'+(+y-4)+'" text-anchor="end" font-size="10" style="fill:var(--warn);font-family:var(--f-num)">'+esc(o.targetLabel||'')+'</text>';
  }
  xIdx(n).forEach(i=>{s+='<text x="'+(pl+slot*i+slot/2).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" '+SVGT+'>'+esc(items[i].l)+'</text>'});
  return s+'</svg>';
}
function lineChart(items,o){
  o=o||{};const n=items.length;if(!n)return '';
  const W=320,H=150,pl=o.unit?60:34,pr=12,pt=12,pb=24,pw=W-pl-pr,ph=H-pt-pb;
  const vals=items.map(i=>i.v).concat(o.ghost||[]);
  let lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);
  if(hi-lo<1){const c=(hi+lo)/2;lo=c-1;hi=c+1}else{const pd=(hi-lo)*.12;lo-=pd;hi+=pd}
  lo=Math.floor(lo);hi=Math.ceil(hi);if(lo<0&&Math.min.apply(null,vals)>=0)lo=0;if(hi-lo<2)hi=lo+2;
  const X=i=>n>1?pl+pw*i/(n-1):pl+pw/2,Y=v=>pt+ph*(1-(v-lo)/(hi-lo));
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'')+'">';
  [lo,(lo+hi)/2,hi].forEach(v=>{
    const y=Y(v);
    s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" style="stroke:var(--line)" stroke-width="1"/>'+
       '<text x="'+(pl-6)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" '+SVGT+'>'+short(v)+(o.unit?' '+esc(o.unit):'')+'</text>';
  });
  if(o.ghost)o.ghost.forEach((g,i)=>{s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(g).toFixed(1)+'" r="2" style="fill:var(--mut)" opacity=".55"/>'});
  if(n>1)s+='<polyline points="'+items.map((it,i)=>X(i).toFixed(1)+','+Y(it.v).toFixed(1)).join(' ')+'" fill="none" style="stroke:var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  items.forEach((it,i)=>{if(i<n-1)s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(it.v).toFixed(1)+'" r="2.4" style="fill:var(--acc)"/>'});
  s+='<circle cx="'+X(n-1).toFixed(1)+'" cy="'+Y(items[n-1].v).toFixed(1)+'" r="4.5" style="fill:var(--acc);stroke:var(--bg)" stroke-width="2"/>';
  xIdx(n).forEach(i=>{
    const x=X(i);const anchor=i===0&&n>1?'start':(i===n-1&&n>1?'end':'middle');
    s+='<text x="'+x.toFixed(1)+'" y="'+(H-7)+'" text-anchor="'+anchor+'" '+SVGT+'>'+esc(items[i].l)+'</text>';
  });
  return s+'</svg>';
}

function weekStreak(){
  const goal=Math.max(1,Math.min(14,meta.weekGoal||3)),cnt={};
  trSess().forEach(x=>{const k=weekKey(x.date);cnt[k]=(cnt[k]||0)+1});
  const d=weekStart(new Date()),cur=cnt[dstr(d)]||0;let n=cur>=goal?1:0;
  d.setDate(d.getDate()-7);

function topDelta(a,b){
  if(!a||!b||a.mode!==b.mode)return null;
  const parts=[];let cls='';
  if(a.mode==='reps'){
    const dk=Math.round((wv(b.kg)-wv(a.kg))*100)/100,dr=Math.round((b.val-a.val)*100)/100;
    if(dk)parts.push((dk>0?'+':'')+fmtN(dk)+' '+uW());if(dr)parts.push((dr>0?'+':'')+fmtN(dr)+' '+t('uReps'));
    cls=(dk>0||(dk===0&&dr>0))?'good':((dk<0||(dk===0&&dr<0))?'warn':'');
  }else{const dv=b.val-a.val;if(dv)parts.push((dv>0?'+':'')+fmtN(dv)+' s');cls=dv>0?'good':(dv<0?'warn':'')}
  return{txt:parts.length?parts.join(' · '):t('rvSame'),cls:cls};
}

let undoStack=[],undoFor='';

function pushUndo(){
  if(!active)return;
  if(undoFor!==active.id){undoStack=[];undoFor=active.id}
  const c=Object.assign({},active);delete c.u;
  const j=JSON.stringify(c);
  if(undoStack[undoStack.length-1]!==j){undoStack.push(j);if(undoStack.length>40)undoStack.shift()}
}

function undo(){
  if(!active||!undoStack.length||undoFor!==active.id){toast(t('undoNone'));return}
  const o=JSON.parse(undoStack.pop());o.u=Date.now();o.sw=null;active=o;persistActive();render();toast(t('undone'));
}

  sessions.forEach(x=>{cnt[x.date]=(cnt[x.date]||0)+sessionStats(x).sets});
  let g='',cell=12,w=53;
  for(let c=0;c<w;c++)for(let r=0;r<7;r++){
    const d=new Date(st.getFullYear(),st.getMonth(),st.getDate()+c*7+r,12);if(d>today)continue;
    const n=cnt[dstr(d)]||0,op=n?(n<10?.4:(n<20?.7:1)):1;
    g+='<rect x="'+c*cell+'" y="'+r*cell+'" width="10" height="10" rx="2" style="fill:'+(n?'var(--acc)':'var(--line)')+'" opacity="'+op+'"/>';
  }
  return '<div class="heat"><svg width="'+(w*cell)+'" height="'+(7*cell)+'" viewBox="0 0 '+(w*cell)+' '+(7*cell)+'" role="img" aria-label="'+esc(t('trHeat'))+'">'+g+'</svg></div>';
}

  }
  /* ranking */
  const rk={};WS.forEach(q=>{const k=ckey(q.ex.name);(rk[k]||(rk[k]={n:libDisp(q.ex.name),c:0})).c++});

  if(bw>0){
    const rr=exLibNames().map(n=>{const r=exStats(n);return r&&!r.timeOnly&&r.hasW&&!(r.best&&r.best.bw)&&r.maxKg>0?{l:n,v:Math.round(r.maxKg/bw*100)/100}:null}).filter(Boolean).sort((x,y)=>y.v-x.v).slice(0,6);

  }

function drawSummary(){

  g.fillStyle=bg;g.fillRect(0,0,W,H);

  let sets=0,vol=0,mins=0;inM.forEach(x=>{const z=sessionStats(x);sets+=z.sets;vol+=z.vol;if(isFinite(x.startedAt)&&isFinite(x.endedAt)&&x.endedAt>x.startedAt)mins+=(x.endedAt-x.startedAt)/60000});

  stats.forEach((q,i)=>{const x=80+i*300;g.fillStyle=acc;let fs=92;g.font='700 '+fs+'px '+F;while(g.measureText(q[0]).width>(i===2?W-80-x:270)&&fs>40){fs-=4;g.font='700 '+fs+'px '+F}g.fillText(q[0],x,400);g.fillStyle=mut;g.font='500 32px '+F;g.fillText(q[1],x,450)});
  /* calendar dots */

  const top=Object.keys(ex).map(k=>ex[k]).sort((a,b)=>b.v-a.v||b.c-a.c).slice(0,4);

function radarChart(items){

  const P=(i,f)=>{const q=pt(i,f);return q[0].toFixed(1)+','+q[1].toFixed(1)};
  let g='<svg class="chart radar" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(t('trRadar'))+'">';
  [.25,.5,.75,1].forEach(f=>{g+='<polygon points="'+items.map((_,i)=>P(i,f)).join(' ')+'" fill="none" style="stroke:var(--line)" stroke-width="1"/>'});
  items.forEach((it,i)=>{
    const e=pt(i,1),l=pt(i,1.12),an=l[2]>.3?'start':(l[2]<-.3?'end':'middle');
    let lb=it.l;if(lb.length>13)lb=lb.slice(0,12)+'…';

  });
  g+='<polygon points="'+items.map((it,i)=>P(i,Math.max(.03,it.v/mx))).join(' ')+'" style="fill:var(--acc);stroke:var(--acc)" fill-opacity=".32" stroke-width="2" stroke-linejoin="round"/>';
  items.forEach((it,i)=>{if(it.v>0){const q=pt(i,Math.max(.03,it.v/mx));g+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3" style="fill:var(--acc)"/>'}});

  if(!active.em)active.em={every:60,rounds:10,run:false,t0:0,el:0,k:0};
  const R=active.em.rounds;
  l.forEach((ex,i)=>{const c=Math.max(0,Math.floor((R-i+l.length-1)/l.length));if(!(pn(ex.tv)>0))ex.tv=10;
    while(ex.sets.length<c)ex.sets.push({kg:'',val:'',rir:'',rest:null,done:false,ty:'n'});

function emTick(){

  await shareFile('dziennik-serii-'+todayStr()+'.csv','text/csv',text);

function parseCsv(text){
  text=String(text).replace(/^﻿/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const sep=[';','\t',','].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===sep){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
    else cur+=c;
  }
  row.push(cur);if(row.some(x=>x.trim()!==''))rows.push(row);
  return rows;
}
const CSV_COLS={
  date:['date','data','start_time','workout date','date (utc)'],
  workout:['workout','workout name','workout_name','title','trening','nazwa treningu'],
  exercise:['exercise','exercise name','exercise_name','exercise_title','ćwiczenie','cwiczenie'],
  set:['set','set order','set number','set_index','seria','set_order'],
  type:['type','set type','set_type','typ'],
  kg:['weight (kg)','weight_kg','weight','kg','ciężar','ciezar','weight (lbs)','weight (lb)'],
  reps:['reps','repetitions','powt.','powtórzenia','powtorzenia'],
  sec:['seconds','duration_seconds','duration (s)','czas (s)','sekundy'],
  rir:['rir'],rpe:['rpe'],rest:['rest (s)','rest','odpoczynek'],
  note:['workout note','workout notes','note','notes','notatka','description'],
  end:['end_time','end'],bw:['bodyweight']
};
function csvDate(v){
  v=String(v||'').trim();let m;
  if((m=v.match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2}))?/)))return{d:m[1]+'-'+m[2]+'-'+m[3],t:m[4]?new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5]).getTime():null};
  if((m=v.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})(?:[ ,T]+(\d{1,2}):(\d{2}))?/))){
    let a=+m[1],b=+m[2];if(a<=12&&b>12){const x=a;a=b;b=x}
    return{d:m[3]+'-'+pad(b)+'-'+pad(a),t:m[4]?new Date(+m[3],b-1,a,+m[4],+m[5]).getTime():null};
  }
  return null;
}
function hashId(str){let h=5381;for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return 'i'+(h>>>0).toString(36)}
function buildCsvSessions(rows){
  if(rows.length<2)return{err:'csvNoRows'};
  const head=rows[0].map(x=>x.trim().toLowerCase()),col={};
  Object.keys(CSV_COLS).forEach(k=>{for(const n of CSV_COLS[k]){const i=head.indexOf(n);if(i>=0){col[k]=i;break}}});
  if(col.date===undefined||col.exercise===undefined)return{err:'csvNoCols'};
  const lbs=col.kg!==undefined&&/lb/.test(head[col.kg]),num=v=>pn(String(v==null?'':v).replace(',','.'));
  const map={},order=[];let nSets=0;
  rows.slice(1).forEach((r,ri)=>{
    const dt=csvDate(r[col.date]);if(!dt)return;
    const exn=String(r[col.exercise]||'').trim();if(!exn)return;
    const reps=col.reps!==undefined?num(r[col.reps]):null,sec=col.sec!==undefined?num(r[col.sec]):null;
    if(!(reps>0)&&!(sec>0))return;
    const wn=(col.workout!==undefined?String(r[col.workout]||'').trim():'')||t('workout');
    const key=dt.d+'|'+wn+'|'+(dt.t||'');
    const se=map[key]||(map[key]={id:'',planId:null,name:wn,date:dt.d,startedAt:dt.t||undefined,note:'',remark:'',exercises:[],_ex:{},_k:key});
    if(!map[key].added){map[key].added=1;order.push(se)}
    if(col.note!==undefined&&!se.note){const nv=String(r[col.note]||'').trim();if(nv)se.note=nv}
    let ex=se._ex[norm(exn)];
    if(!ex){ex={name:exn,mode:'reps',bw:false,sets:[]};se._ex[norm(exn)]=ex;se.exercises.push(ex)}
    const time=!(reps>0)&&sec>0;if(time)ex.mode='time';
    let kg=col.kg!==undefined?num(r[col.kg]):null;if(kg===null)kg=0;if(lbs)kg=Math.round(kg*0.45359237*100)/100;
    const tyRaw=col.type!==undefined?String(r[col.type]||'').toLowerCase():'';
    const ty=/warm|^w$/.test(tyRaw)?'w':(/drop|^d$/.test(tyRaw)?'d':(/fail|^f$/.test(tyRaw)?'f':(/assist|^a$/.test(tyRaw)?'a':'n')));
    let rir=null;if(col.rir!==undefined)rir=num(r[col.rir]);else if(col.rpe!==undefined){const v=num(r[col.rpe]);if(v!==null&&v>0&&v<=10)rir=10-v}
    const st={kg:kg,val:time?sec:reps,rir:rir,rest:col.rest!==undefined?num(r[col.rest]):null};
    if(ty!=='n')st.ty=ty;
    if(col.bw!==undefined&&/^(1|true|yes|tak)$/i.test(String(r[col.bw]).trim()))ex.bw=true;
    ex.sets.push(st);nSets++;
  });
  order.forEach(se=>{se.id=hashId(se._k);delete se._ex;delete se._k;delete se.added;
    if(se.startedAt){se.endedAt=se.startedAt}});
  return{sessions:order,nSets:nSets,lbs:lbs};
}
async function importCsvText(text){

  const fresh=res.sessions.filter(x=>!have[x.id]);

  const ok=await ask(t('csvQ',{n:cnt('wk',fresh.length),s:cnt('set',fresh.reduce((a,x)=>a+x.exercises.reduce((b,e)=>b+e.sets.length,0),0))})+(res.lbs?' '+t('csvLbs'):'')+' '+t('csvKg'),t('importBtn'),false);
  if(!ok)return;

  persistSessions();render();toast(t('csvDone',{n:fresh.length}));
}

    case 'fd-rest':{const n=pn(el.value);if(n!==null&&n>=0&&n<=900){meta.freeDef=Object.assign({},fd(),{rest:Math.round(n)});persistMeta()}break}
    case 'rec-q':{ui.recQ=el.value;const l=$('#recList');if(l)l.innerHTML=recPickHtml()}break;
    /*INPUT*/
  }
});
$('#photoIn').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(f)processPhoto(f)});
$('#csvIn').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  let txt='';try{txt=await f.text()}catch(_){}
  importCsvText(txt);
});
$('#importIn').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  let txt='';try{txt=await f.text()}catch(_){}
  importText(txt);
});

document.addEventListener('focusin',e=>{const k=e.target.dataset&&e.target.dataset.k;if(active&&ui.screen==='logger'&&(k==='kg'||k==='val'||k==='rir'||k==='rest'||k==='ex-name'))pushUndo()});

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='pkIn'){const b=$('#pkNew');if(b&&!b.hidden)b.click();e.preventDefault()}});

/* ---------- boot ---------- */
function migNames(){
  try{
    const fix=e=>{if(e&&e.name){const d=libDisp(e.name);if(d!==e.name&&ckey(d)===ckey(e.name)){e.name=d;return true}}return false};
    let a=false,b=false;
    sessions.forEach(x=>(x.exercises||[]).forEach(e=>{if(fix(e))a=true}));
    (meta.plans||[]).forEach(x=>(x.exercises||[]).forEach(e=>{if(fix(e))b=true}));
    if(active&&active.exercises)active.exercises.forEach(e=>{if(fix(e))b=true});
    meta.recentEx=(meta.recentEx||[]).map(n=>libDisp(n));
    if(a)persistSessions();
    if(a||b){persistMeta();if(active)persistActive()}
  }catch(e){}
}
migNames();
render();
initDb();
})();
</script>
